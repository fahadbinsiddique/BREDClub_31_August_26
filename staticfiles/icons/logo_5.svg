<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      .green { fill:#24A148; }
      .blue { fill:#1E73BE; }
      .red { fill:#B33A3A; }
      .shadow { fill:#D9D9D9; }
      .swoosh {
        fill: none;
        stroke: #1E73BE;
        stroke-width: 8;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Rounded square border -->
  <rect
    x="20"
    y="20"
    width="460"
    height="460"
    rx="30"
    ry="30"
    fill="white"
    stroke="#1E73BE"
    stroke-width="6"/>

  <!-- Center the logo vertically -->
  <g transform="translate(0,90)">

    <!-- Shadow -->
    <path class="shadow"
          d="M110 255 Q250 285 390 255 Q250 300 110 255 Z"/>

    <!-- Blue swoosh -->
    <path class="swoosh"
          d="M160 190 Q250 40 340 190"/>

    <!-- Center person -->
    <circle class="blue" cx="250" cy="50" r="16"/>
    <path class="blue"
          d="M220 75
             L280 75
             L305 165
             L250 205
             L195 165 Z"/>

    <!-- Left person -->
    <circle class="green" cx="120" cy="105" r="12"/>
    <path class="green"
          d="M95 125
             L145 125
             L163 193
             L120 225
             L77 193 Z"/>

    <!-- Right person -->
    <circle class="green" cx="380" cy="105" r="12"/>
    <path class="green"
          d="M355 125
             L405 125
             L423 193
             L380 225
             L337 193 Z"/>

    <!-- Stars -->
    <g class="red">
      <text x="150" y="45" font-size="18" text-anchor="middle">★</text>
      <text x="175" y="35" font-size="12" text-anchor="middle">★</text>

      <text x="350" y="45" font-size="18" text-anchor="middle">★</text>
      <text x="325" y="35" font-size="12" text-anchor="middle">★</text>
    </g>

  </g>
</svg>
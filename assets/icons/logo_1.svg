    <!-- Organization Name -->
    <text x="300"
          y="465"
          text-anchor="middle"
          font-size="42"
          font-family="Segoe UI, Arial, sans-serif"
          font-weight="700"
          fill="#0B5ED7">
        BREDClub
    </text>

             C285 145 310 185 300 235"
          fill="#198754"/>

    <path d="M300 235
             C360 225 385 170 355 130
             C315 145 290 185 300 235"
          fill="#198754"/>

    <!-- Human Figures -->
    <circle cx="245" cy="275" r="15" fill="#F59E0B"/>
    <circle cx="355" cy="275" r="15" fill="#F59E0B"/>
    <circle cx="300" cy="255" r="18" fill="#0B5ED7"/>

    <path d="M225 315
             Q245 290 265 315
             L265 340
             L225 340 Z"
